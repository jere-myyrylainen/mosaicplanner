<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9f6">
  <title>Mosaic Planner</title>
  <link rel="stylesheet" href="styles.css?v=10">
  <script defer src="i18n.js?v=11"></script>
  <script defer src="geometry.js?v=17"></script>
  <script defer src="board-renderer.js?v=7"></script>
  <script defer src="project-storage.js?v=1"></script>
  <script defer src="editor.js?v=13"></script>
</head>
<body inert>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mosaic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-rectangle" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-rounded" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="4"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 6L5 3Z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4M14 21h7"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M7.5 16.5l9-9"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/></symbol>
    <symbol id="i-shape" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="m4 12 7-7 7 7-7 7-7-7Zm3-9 4 4m-7 5h14m2 3s-2 2.5-2 4a2 2 0 0 0 4 0c0-1.5-2-4-2-4Z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 14 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-7 7H8l-4-4a1 1 0 0 1 0-1Zm5-5 8 8m-4 2h8"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.5l-4-5a1.5 1.5 0 0 1 2-2.2l2 1.7Z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5m-5-5h11a5 5 0 0 1 5 5v1"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m5-5H9a5 5 0 0 0-5 5v1"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6m-2-6V5m0 6h6"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M4 6h16M9 6V4h6v2m3 0-1 14H7L6 6m4 4v6m4-6v6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-6 6M10 19H5v-5m0 5 6-6"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M19 5l-6 6m0-5v5h5M5 19l6-6m-5 0h5v5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 19V5h7l2 2h9v12H3Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4m-12 5v4h16v-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-mosaic"/></svg></span>
      <h1>Mosaic Planner</h1>
    </div>
    <div class="project-name">
      <input id="project-name" type="text" data-aria-label="projectName" maxlength="80" autocomplete="off" spellcheck="false">
      <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>
    </div>
    <nav class="file-actions" data-aria-label="fileActions">
      <button type="button" id="new-project" class="button quiet"><svg class="icon"><use href="#i-plus"/></svg><span data-text="newProject"></span></button>
      <button type="button" id="open-project" class="button quiet"><svg class="icon"><use href="#i-folder"/></svg><span data-text="openProject"></span></button>
      <button type="button" id="save-project" class="button primary"><svg class="icon"><use href="#i-download"/></svg><span data-text="saveProject"></span></button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </nav>
    <select id="language-select" class="language-select" data-aria-label="language" data-title="language">
      <option value="fi" lang="fi">Suomi</option>
      <option value="en" lang="en">English</option>
    </select>
  </header>

  <main class="editor">
    <aside class="settings sidebar" data-aria-label="projectSettings">
      <section class="panel">
        <h2 data-text="board"></h2>
        <div class="panel-fields">
          <fieldset>
            <legend data-text="shape"></legend>
            <div class="board-shapes">
              <label data-title="rectangle"><input type="radio" name="board-shape" value="rectangle"><span><svg class="icon"><use href="#i-rectangle"/></svg><span class="sr-only" data-text="rectangle"></span></span></label>
              <label data-title="circle"><input type="radio" name="board-shape" value="circle"><span><svg class="icon"><use href="#i-circle"/></svg><span class="sr-only" data-text="circle"></span></span></label>
              <label data-title="roundedRectangle"><input type="radio" name="board-shape" value="rounded"><span><svg class="icon"><use href="#i-rounded"/></svg><span class="sr-only" data-text="roundedRectangle"></span></span></label>
            </div>
          </fieldset>
          <div class="fields-row">
            <label class="field"><span id="board-width-label"></span><span class="number-field"><input type="number" id="board-width" min="1" max="10000" step="0.1"><span>mm</span></span></label>
            <label class="field" id="board-height-field"><span data-text="height"></span><span class="number-field"><input type="number" id="board-height" min="1" max="10000" step="0.1"><span>mm</span></span></label>
          </div>
          <label class="field" id="board-radius-field" hidden><span data-text="cornerRadius"></span><span class="number-field"><input type="number" id="board-radius" min="0" max="5000" step="0.1"><span>mm</span></span></label>
          <div class="fields-row">
            <label class="field"><span data-text="seamWidth"></span><span class="number-field"><input type="number" id="seam-width" min="0" max="100" step="0.1"><span>mm</span></span></label>
            <label class="field"><span data-text="seamColor"></span><input type="color" id="seam-color"></label>
          </div>
        </div>
      </section>

      <section class="panel grid-panel">
        <div class="panel-heading">
          <h2 data-text="grid"></h2>
          <label class="toggle" data-title="showGrid"><input type="checkbox" id="grid-visible" data-aria-label="showGrid"><span></span></label>
        </div>
        <div class="panel-fields">
          <label class="field"><span data-text="gridSize"></span><span class="number-field"><input type="number" id="grid-size" min="0.5" max="1000" step="0.1"><span>mm</span></span></label>
          <label class="field"><span data-text="gridWeight"></span><span class="number-field"><input type="number" id="grid-weight" min="0.1" max="10" step="0.1"><span>mm</span></span></label>
          <div class="fields-row">
            <label class="field"><span data-text="gridOffsetX"></span><span class="number-field"><input type="number" id="grid-offset-x" step="any"><span>mm</span></span></label>
            <label class="field"><span data-text="gridOffsetY"></span><span class="number-field"><input type="number" id="grid-offset-y" step="any"><span>mm</span></span></label>
          </div>
          <button type="button" data-tool="moveGrid" class="button tool quiet" data-text="moveGrid"></button>
          <label class="check-field"><input type="checkbox" id="guides-visible"><span data-text="showGuides"></span></label>
          <label class="check-field"><input type="checkbox" id="grid-snap"><span data-text="snapToGuides"></span></label>
          <label class="check-field"><input type="checkbox" id="tile-snap"><span data-text="snapToTiles"></span></label>
        </div>
      </section>
      <section class="panel reference-panel">
        <h2 data-text="references"></h2>
        <button type="button" id="add-reference" class="button add-reference" data-title="addReferenceTitle">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span data-text="addReference"></span>
        </button>
        <input type="file" id="reference-file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" multiple hidden>
        <div id="reference-controls" class="panel-fields" hidden>
          <label class="field"><span data-text="image"></span><select id="reference-select"></select></label>
          <label class="field"><span data-text="imageWidth"></span><span class="number-field">
            <input type="number" id="reference-width" min="0.1" step="any"><span>mm</span>
          </span></label>
          <div class="field">
            <div class="reference-opacity-label">
              <label for="reference-opacity" data-text="opacity"></label><output id="reference-opacity-value" for="reference-opacity"></output>
            </div>
            <input type="range" id="reference-opacity" min="0" max="100" step="1">
          </div>
          <label class="check-field"><input type="checkbox" id="reference-visible"><span data-text="showImage"></span></label>
          <div class="reference-actions">
            <button type="button" data-tool="reference" class="button tool quiet" data-title="moveImageTitle" data-text="moveImage"></button>
            <button type="button" id="fit-reference" class="button quiet" data-text="fitImage"></button>
            <button type="button" id="remove-reference" class="button quiet delete-button">
              <svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg><span data-text="removeReference"></span>
            </button>
          </div>
        </div>
      </section>
    </aside>

    <section class="workspace" data-aria-label="workspace">
      <div class="toolbar">
        <div class="button-group" role="group" data-aria-label="tools">
          <button type="button" class="icon-button tool" data-tool="select" data-title="selectTitle" data-aria-label="selectLabel" aria-keyshortcuts="V Escape"><svg class="icon"><use href="#i-pointer"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="draw" data-title="drawTitle" data-aria-label="drawLabel"><svg class="icon"><use href="#i-pencil"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="line" data-title="lineTitle" data-aria-label="line"><svg class="icon"><use href="#i-line"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="shape" data-title="shapeTitle" data-aria-label="shapeLabel"><svg class="icon"><use href="#i-shape"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="fill" data-title="fillTitle" data-aria-label="fillLabel"><svg class="icon"><use href="#i-fill"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="erase" data-title="eraseTitle" data-aria-label="erase" aria-keyshortcuts="E"><svg class="icon"><use href="#i-eraser"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="pan" data-title="panTitle" data-aria-label="pan"><svg class="icon"><use href="#i-hand"/></svg></button>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <div class="button-group guide-tools" role="group" data-aria-label="guides">
          <button type="button" class="icon-button tool" data-tool="guideLine" data-title="guideLine" data-aria-label="guideLine"><svg class="icon"><use href="#i-line"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="guideSquare" data-title="guideSquare" data-aria-label="guideSquare"><svg class="icon"><use href="#i-shape"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="guideCircle" data-title="guideCircle" data-aria-label="guideCircle"><svg class="icon"><use href="#i-circle"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="guideErase" data-title="guideErase" data-aria-label="guideErase"><svg class="icon"><use href="#i-delete"/></svg></button>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <div class="button-group" role="group" data-aria-label="history">
          <button type="button" id="undo" class="icon-button" data-title="undoTitle" data-aria-label="undo"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button type="button" id="redo" class="icon-button" data-title="redoTitle" data-aria-label="redo"><svg class="icon"><use href="#i-redo"/></svg></button>
        </div>
        <label id="outline-field" class="outline-mode" hidden><span class="sr-only" data-text="outlineShape"></span><select id="outline-shape"><option value="rectangle" data-text="rectangle"></option><option value="ellipse" data-text="ellipse"></option></select></label>
        <span class="tool-name" id="tool-name"></span>
      </div>

      <div class="stage" id="stage" data-tool="draw">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" data-aria-label="canvas" role="img">
          <defs>
            <pattern id="grid-pattern" patternUnits="userSpaceOnUse"><path id="grid-lines" fill="none" stroke="#59695e" stroke-opacity=".28"/></pattern>
            <clipPath id="board-clip"></clipPath>
          </defs>
          <g id="board-layer"></g>
          <g id="reference-layer" clip-path="url(#board-clip)" pointer-events="none"></g>
          <g id="grid-layer" pointer-events="none"></g>
          <g id="grout-layer" clip-path="url(#board-clip)" pointer-events="none" aria-hidden="true"></g>
          <g id="piece-layer"></g>
          <g id="guide-layer" pointer-events="none" aria-hidden="true"></g>
          <g id="ruler-layer" pointer-events="none" aria-hidden="true"></g>
          <g id="preview-layer" pointer-events="none"></g>
          <g id="selection-layer" pointer-events="none"></g>
        </svg>
        <div class="zoom-controls" role="group" data-aria-label="zoomControls">
          <button type="button" id="zoom-out" class="icon-button" data-title="zoomOut" data-aria-label="zoomOut"><svg class="icon"><use href="#i-minus"/></svg></button>
          <output id="zoom-level" data-aria-label="zoom">100 %</output>
          <button type="button" id="zoom-in" class="icon-button" data-title="zoomIn" data-aria-label="zoomIn"><svg class="icon"><use href="#i-plus"/></svg></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button type="button" id="zoom-fit" class="icon-button" data-title="fitView" data-aria-label="fitView"><svg class="icon"><use href="#i-fit"/></svg></button>
        </div>
      </div>
      <footer class="statusbar">
        <p id="tool-hint"></p>
        <div id="draw-rotation" class="button-group" hidden>
          <label class="draw-angle">
            <span data-text="rotation"></span>
            <span class="number-field"><input type="number" id="draw-angle" step="0.1" value="0" inputmode="decimal" data-aria-label="drawAngle"><span aria-hidden="true">°</span></span>
          </label>
          <button type="button" id="rotate-draw" class="icon-button" data-title="rotateTitle" data-aria-label="rotateLabel" aria-keyshortcuts="R"><svg class="icon"><use href="#i-rotate"/></svg></button>
        </div>
        <div class="work-info">
          <p id="work-count"></p>
          <details id="piece-inventory" class="piece-inventory">
            <summary id="inventory-summary" data-text="tileInventory"></summary>
            <div class="inventory-panel">
              <p id="empty-inventory" hidden data-text="emptyInventory"></p>
              <table id="inventory-table" data-aria-label="inventoryTable">
                <thead><tr><th scope="col" data-text="tileType"></th><th scope="col" data-text="quantity"></th></tr></thead>
                <tbody id="inventory-rows"></tbody>
              </table>
            </div>
          </details>
        </div>
      </footer>
    </section>

    <aside class="library sidebar" id="tile-library" data-aria-label="tileLibrary">
      <section class="panel library-panel">
        <div class="panel-heading library-heading">
          <h2 data-text="tileLibrary"></h2>
          <button type="button" id="expand-library" class="icon-button" tabindex="0" aria-expanded="false" aria-controls="library-content"
            data-title="expandLibrary" data-aria-label="expandLibrary"><svg class="icon" aria-hidden="true"><use href="#i-expand"/></svg></button>
        </div>
        <div id="library-content" class="library-content">
          <button type="button" id="add-tile-text" class="button add-tile-text"><svg class="icon"><use href="#i-plus"/></svg><span data-text="addTile"></span></button>
          <details class="library-tools" id="library-tools">
            <summary id="library-tools-summary">
              <span data-text="sortFilter"></span>
              <span id="library-filter-count" class="filter-count" hidden></span>
            </summary>
            <div class="library-filters">
              <label class="field"><span data-text="sortOrder"></span><select id="library-sort">
                <option value="added" data-text="addedOrder"></option>
                <option value="name-asc" data-text="nameAscending"></option>
                <option value="name-desc" data-text="nameDescending"></option>
              </select></label>
              <label class="field"><span data-text="size"></span><select id="library-size"><option value="" data-text="allSizes"></option></select></label>
              <label class="field"><span data-text="color"></span><select id="library-color"><option value="" data-text="allColors"></option></select></label>
              <fieldset>
                <legend data-text="tags"></legend>
                <div id="library-tags" class="filter-chips tag-cloud"></div>
                <p id="library-no-tags" class="library-note" data-text="noTags"></p>
              </fieldset>
              <button type="button" id="clear-library-filters" class="button quiet clear-filters" hidden data-text="clearFilters"></button>
            </div>
          </details>
          <p id="library-result" class="library-note" role="status" hidden></p>
          <p id="hidden-drawing-tile" class="library-note" hidden></p>
          <ul id="tile-list" class="tile-list" data-aria-label="tileTypes"></ul>
          <p id="empty-library" class="empty-library" hidden data-text="emptyLibrary"></p>
        </div>
      </section>

      <section class="panel selected-panel" id="selected-panel" hidden>
        <div class="panel-heading"><h2 id="selected-title"></h2></div>
        <p id="selected-name"></p>
        <div class="selected-actions">
          <label class="field" id="selected-angle-field"><span data-text="rotation"></span><span class="number-field"><input type="number" id="selected-angle" step="1" data-aria-label="tileAngle"><span>°</span></span></label>
          <button type="button" id="rotate" class="icon-button" data-title="rotateTitle" data-aria-label="rotateLabel"><svg class="icon"><use href="#i-rotate"/></svg></button>
          <button type="button" id="delete-piece" class="button delete-button quiet" data-title="deleteSelection"><svg class="icon" aria-hidden="true"><use href="#i-delete"/></svg><span id="delete-piece-label"></span></button>
        </div>
      </section>
      <p class="save-status" id="save-status"></p>
    </aside>
  </main>

  <p id="feedback" class="feedback" role="status" hidden></p>

  <dialog id="new-dialog" aria-labelledby="new-dialog-title" aria-describedby="new-dialog-description">
    <form method="dialog">
      <h2 id="new-dialog-title" data-text="startProject"></h2>
      <p id="new-dialog-description" data-text="startProjectDescription"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="button quiet" autofocus data-text="cancel"></button>
        <button type="submit" value="new" class="button primary" data-text="startProject"></button>
      </div>
    </form>
  </dialog>

  <dialog id="tile-dialog" aria-labelledby="tile-dialog-title">
    <form id="tile-form">
      <div class="dialog-heading">
        <h2 id="tile-dialog-title"></h2>
        <button type="button" class="icon-button" id="close-dialog" data-aria-label="close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <label class="field"><span data-text="name"></span><input type="text" id="tile-name" maxlength="60" required autofocus data-placeholder="tileNameExample"></label>
      <div class="fields-row">
        <label class="field"><span data-text="shape"></span><select id="tile-shape">
          <option value="rectangle" data-text="rectangle"></option>
          <option value="circle" data-text="circle"></option>
          <option value="triangle" data-text="triangle"></option>
          <option value="diamond" data-text="diamond"></option>
          <option value="oval" data-text="oval"></option>
          <option value="leaf" data-text="leaf"></option>
        </select></label>
        <label class="field"><span data-text="color"></span><input type="color" id="tile-color" value="#347e73"></label>
      </div>
      <div class="fields-row tile-dimensions">
        <label class="field"><span id="tile-width-label"></span><span id="tile-base-label" data-text="baseLength" hidden></span><span class="number-field"><input type="number" id="tile-width" min="0.5" max="10000" step="0.1" required><span>mm</span></span></label>
        <label class="field" id="tile-height-field"><span data-text="height"></span><span class="number-field"><input type="number" id="tile-height" min="0.5" max="10000" step="0.1" required><span>mm</span></span></label>
        <label class="field" id="tile-apex-angle-field" hidden><span data-text="apexAngle"></span><span class="number-field"><input type="number" id="tile-apex-angle" min="0" max="180" step="any" disabled><span>°</span></span></label>
      </div>
      <div class="field">
        <label for="tile-tags" data-text="tags"></label>
        <input type="text" id="tile-tags" maxlength="480" aria-describedby="tile-tags-hint" data-placeholder="tagsExample">
        <span class="field-hint" id="tile-tags-hint" data-text="tagsHint"></span>
      </div>
      <p class="dialog-error" id="tile-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-tile" class="button quiet" data-text="cancel"></button>
        <button type="submit" class="button primary" data-text="saveTile"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
