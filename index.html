<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f9f9f6">
  <title>Mosaic Planner</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="geometry.js"></script>
  <script defer src="editor.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mosaic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-rectangle" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-rounded" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="4"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="m5 3 14 10-7 1-3 6L5 3Z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4M14 21h7"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M7.5 16.5l9-9"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/></symbol>
    <symbol id="i-shape" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="m4 12 7-7 7 7-7 7-7-7Zm3-9 4 4m-7 5h14m2 3s-2 2.5-2 4a2 2 0 0 0 4 0c0-1.5-2-4-2-4Z"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 14 9-9a2 2 0 0 1 3 0l4 4a2 2 0 0 1 0 3l-7 7H8l-4-4a1 1 0 0 1 0-1Zm5-5 8 8m-4 2h8"/></symbol>
    <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.5l-4-5a1.5 1.5 0 0 1 2-2.2l2 1.7Z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5m-5-5h11a5 5 0 0 1 5 5v1"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m5-5H9a5 5 0 0 0-5 5v1"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6m-2-6V5m0 6h6"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M4 6h16M9 6V4h6v2m3 0-1 14H7L6 6m4 4v6m4-6v6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 19V5h7l2 2h9v12H3Z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4m-12 5v4h16v-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4L4 16Zm10-10 4 4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-mosaic"/></svg></span>
      <h1>Mosaic Planner</h1>
    </div>
    <div class="project-name">
      <input id="project-name" type="text" aria-label="Työn nimi" maxlength="80" autocomplete="off" spellcheck="false">
      <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>
    </div>
    <nav class="file-actions" aria-label="Tiedosto">
      <button type="button" id="new-project" class="button quiet"><svg class="icon"><use href="#i-plus"/></svg> Uusi</button>
      <button type="button" id="open-project" class="button quiet"><svg class="icon"><use href="#i-folder"/></svg> Avaa</button>
      <button type="button" id="save-project" class="button primary"><svg class="icon"><use href="#i-download"/></svg> Tallenna</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </nav>
  </header>

  <main class="editor">
    <aside class="settings sidebar" aria-label="Työn asetukset">
      <section class="panel">
        <h2>Työn alusta</h2>
        <div class="panel-fields">
          <fieldset>
            <legend>Muoto</legend>
            <div class="board-shapes">
              <label title="Suorakulmio"><input type="radio" name="board-shape" value="rectangle"><span><svg class="icon"><use href="#i-rectangle"/></svg><span class="sr-only">Suorakulmio</span></span></label>
              <label title="Ympyrä"><input type="radio" name="board-shape" value="circle"><span><svg class="icon"><use href="#i-circle"/></svg><span class="sr-only">Ympyrä</span></span></label>
              <label title="Pyöristetty suorakulmio"><input type="radio" name="board-shape" value="rounded"><span><svg class="icon"><use href="#i-rounded"/></svg><span class="sr-only">Pyöristetty suorakulmio</span></span></label>
            </div>
          </fieldset>
          <div class="fields-row">
            <label class="field"><span id="board-width-label">Leveys</span><span class="number-field"><input type="number" id="board-width" min="1" max="10000" step="0.1"><span>mm</span></span></label>
            <label class="field" id="board-height-field">Korkeus<span class="number-field"><input type="number" id="board-height" min="1" max="10000" step="0.1"><span>mm</span></span></label>
          </div>
          <label class="field" id="board-radius-field" hidden>Kulmasäde<span class="number-field"><input type="number" id="board-radius" min="0" max="5000" step="0.1"><span>mm</span></span></label>
          <label class="field">Sauman leveys<span class="number-field"><input type="number" id="seam-width" min="0" max="100" step="0.1"><span>mm</span></span></label>
        </div>
      </section>

      <section class="panel grid-panel">
        <div class="panel-heading">
          <h2>Apuristikko</h2>
          <label class="toggle" title="Näytä apuristikko"><input type="checkbox" id="grid-visible" aria-label="Näytä apuristikko"><span></span></label>
        </div>
        <div class="panel-fields">
          <label class="field">Ruudun koko<span class="number-field"><input type="number" id="grid-size" min="0.5" max="1000" step="0.1"><span>mm</span></span></label>
          <label class="field">Viivan paksuus<span class="number-field"><input type="number" id="grid-weight" min="0.1" max="10" step="0.1"><span>mm</span></span></label>
          <label class="check-field"><input type="checkbox" id="grid-snap"> Tartu apuristikkoon</label>
        </div>
      </section>
    </aside>

    <section class="workspace" aria-label="Mosaiikin piirtoalue">
      <div class="toolbar">
        <div class="button-group" role="group" aria-label="Työkalut">
          <button type="button" class="icon-button tool" data-tool="select" title="Valitse ja siirrä (V)" aria-label="Valitse ja siirrä"><svg class="icon"><use href="#i-pointer"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="draw" title="Aseta pala tai piirrä vapaasti (B)" aria-label="Aseta pala tai piirrä vapaasti"><svg class="icon"><use href="#i-pencil"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="line" title="Viiva (L)" aria-label="Viiva"><svg class="icon"><use href="#i-line"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="shape" title="Muodon ääriviiva (M)" aria-label="Muodon ääriviiva"><svg class="icon"><use href="#i-shape"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="fill" title="Ruudukkotäyttö (G)" aria-label="Ruudukkotäyttö"><svg class="icon"><use href="#i-fill"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="erase" title="Pyyhekumi (E)" aria-label="Pyyhekumi" aria-keyshortcuts="E"><svg class="icon"><use href="#i-eraser"/></svg></button>
          <button type="button" class="icon-button tool" data-tool="pan" title="Siirrä näkymää (H tai välilyönti)" aria-label="Siirrä näkymää"><svg class="icon"><use href="#i-hand"/></svg></button>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <div class="button-group" role="group" aria-label="Muutoshistoria">
          <button type="button" id="undo" class="icon-button" title="Kumoa (⌘/Ctrl Z)" aria-label="Kumoa"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button type="button" id="redo" class="icon-button" title="Tee uudelleen (⌘/Ctrl Shift Z)" aria-label="Tee uudelleen"><svg class="icon"><use href="#i-redo"/></svg></button>
        </div>
        <label id="outline-field" class="outline-mode" hidden><span class="sr-only">Piirrettävä muoto</span><select id="outline-shape"><option value="rectangle">Suorakulmio</option><option value="ellipse">Ellipsi</option></select></label>
        <span class="tool-name" id="tool-name"></span>
      </div>

      <div class="stage" id="stage" data-tool="draw">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" aria-label="Mosaiikkialusta" role="img">
          <defs>
            <pattern id="grid-pattern" patternUnits="userSpaceOnUse"><path id="grid-lines" fill="none" stroke="#59695e" stroke-opacity=".28"/></pattern>
          </defs>
          <g id="board-layer"></g>
          <g id="piece-layer"></g>
          <g id="preview-layer" pointer-events="none"></g>
          <g id="selection-layer" pointer-events="none"></g>
        </svg>
        <div class="zoom-controls" role="group" aria-label="Näkymän suurennus">
          <button type="button" id="zoom-out" class="icon-button" title="Pienennä" aria-label="Pienennä"><svg class="icon"><use href="#i-minus"/></svg></button>
          <output id="zoom-level" aria-label="Suurennus">100 %</output>
          <button type="button" id="zoom-in" class="icon-button" title="Suurenna" aria-label="Suurenna"><svg class="icon"><use href="#i-plus"/></svg></button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <button type="button" id="zoom-fit" class="icon-button" title="Sovita näkymään" aria-label="Sovita näkymään"><svg class="icon"><use href="#i-fit"/></svg></button>
        </div>
      </div>
      <footer class="statusbar">
        <p id="tool-hint"></p>
        <p id="work-count"></p>
      </footer>
    </section>

    <aside class="library sidebar" aria-label="Palakirjasto">
      <section class="panel">
        <h2>Palakirjasto</h2>
        <ul id="tile-list" class="tile-list" aria-label="Palatyypit"></ul>
        <button type="button" id="add-tile-text" class="button add-tile-text"><svg class="icon"><use href="#i-plus"/></svg> Lisää pala</button>
      </section>

      <section class="panel selected-panel" id="selected-panel" hidden>
        <div class="panel-heading"><h2>Valittu pala</h2></div>
        <p id="selected-name"></p>
        <div class="selected-actions">
          <label class="field">Kierto<span class="number-field"><input type="number" id="selected-angle" step="1" aria-label="Palakulma"><span>°</span></span></label>
          <button type="button" id="rotate" class="icon-button" title="Kierrä 15° (R)" aria-label="Kierrä 15 astetta"><svg class="icon"><use href="#i-rotate"/></svg></button>
          <button type="button" id="delete-piece" class="icon-button delete-button" title="Poista valittu pala" aria-label="Poista valittu pala"><svg class="icon"><use href="#i-delete"/></svg></button>
        </div>
      </section>
      <p class="save-status" id="save-status"></p>
    </aside>
  </main>

  <p id="feedback" class="feedback" role="status" hidden></p>

  <dialog id="new-dialog" aria-labelledby="new-dialog-title" aria-describedby="new-dialog-description">
    <form method="dialog">
      <h2 id="new-dialog-title">Aloita uusi työ</h2>
      <p id="new-dialog-description">Uusi työ avautuu tyhjälle alustalle. Voit palata nykyiseen työhön Kumoa-painikkeella.</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="button quiet" autofocus>Peruuta</button>
        <button type="submit" value="new" class="button primary">Aloita uusi työ</button>
      </div>
    </form>
  </dialog>

  <dialog id="tile-dialog" aria-labelledby="tile-dialog-title">
    <form id="tile-form">
      <div class="dialog-heading">
        <h2 id="tile-dialog-title">Lisää palatyyppi</h2>
        <button type="button" class="icon-button" id="close-dialog" aria-label="Sulje"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <label class="field">Nimi<input type="text" id="tile-name" maxlength="60" required autofocus placeholder="Esim. vihreä lasipala"></label>
      <div class="fields-row">
        <label class="field">Muoto<select id="tile-shape"><option value="rectangle">Suorakulmio</option><option value="circle">Ympyrä</option><option value="triangle">Kolmio</option></select></label>
        <label class="field">Väri<input type="color" id="tile-color" value="#347e73"></label>
      </div>
      <div class="fields-row">
        <label class="field"><span id="tile-width-label">Leveys</span><span class="number-field"><input type="number" id="tile-width" min="0.5" max="10000" step="0.1" required><span>mm</span></span></label>
        <label class="field" id="tile-height-field">Korkeus<span class="number-field"><input type="number" id="tile-height" min="0.5" max="10000" step="0.1" required><span>mm</span></span></label>
      </div>
      <p class="dialog-error" id="tile-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="cancel-tile" class="button quiet">Peruuta</button>
        <button type="submit" class="button primary">Tallenna pala</button>
      </div>
    </form>
  </dialog>
</body>
</html>
